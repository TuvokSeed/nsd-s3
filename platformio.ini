; nostr-signer-s3 — Nostr hardware signer for LilyGo T-Display S3
; v0.0.1: board bring-up (display, buttons, USB CDC)

[env:tdisplay-s3]
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DLGFX_USE_V1
    ; native USB: serial console on the USB-C port, available at boot
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    https://github.com/micro-bitcoin/uBitcoin.git
    ricmoo/QRCode@^0.0.1
    bblanchon/ArduinoJson@^7.2.0
